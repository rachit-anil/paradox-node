name: Deploy (blue-green)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Pre-deploy quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Backend install + typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Frontend install + production build
        working-directory: ui
        run: |
          npm ci
          npm run build--prod

  deploy:
    name: Build, push, blue-green cutover
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX || 'paradox-production' }}
      PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX || '/paradox' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          REPO_URL=$(aws ecr describe-repositories \
            --repository-names "${NAME_PREFIX}-app" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "repo=${REPO_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Blue-green deploy
        run: |
          chmod +x scripts/blue-green.sh
          ./scripts/blue-green.sh deploy "${{ steps.meta.outputs.tag }}"

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      artifactType:
        description: 'Artifact type to build/publish'
        required: false
        type: choice
        default: SNAPSHOT
        options:
          - SNAPSHOT
          - RELEASE
      commit:
        description: 'Commit SHA to build and deploy (leave empty for a normal primary build)'
        required: false
      branch:
        description: 'Branch the commit belongs to (required if commit is set)'
        required: false
  push:
    branches:
      - primary
      - 'feature/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate on-demand dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "${{ github.event.inputs.commit }}" && -z "${{ github.event.inputs.branch }}" ]] || \
             [[ -z "${{ github.event.inputs.commit }}" && -n "${{ github.event.inputs.branch }}" ]]; then
            echo "::error::Both 'commit' and 'branch' inputs must be provided together (or both left empty)."
            exit 1
          fi
name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      artifactType:
        description: 'Artifact type to build/publish'
        required: false
        type: choice
        default: SNAPSHOT
        options:
          - SNAPSHOT
          - RELEASE
      commit:
        description: 'Commit SHA to build and deploy'
        required: true
      branch:
        description: 'Branch the commit belongs to'
        required: true
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Enforce dispatch from main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "::error::This workflow must be run from the 'main' branch. Selected: '${{ github.ref_name }}'."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history is required so we can verify the commit/branch relationship below.
          fetch-depth: 0

      - name: Validate on-demand dispatch inputs - commit and branch exist and match
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ github.event.inputs.commit }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail

          # 1. Verify the branch exists on the remote.
          if ! git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch '${BRANCH}' does not exist on origin."
            exit 1
          fi

          # 2. Make sure we have the branch history locally, then verify the commit exists.
          git fetch --quiet origin "${BRANCH}"
          if ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
            echo "::error::Commit '${COMMIT}' does not exist in the repository."
            exit 1
          fi

          # 3. Verify the commit is actually contained in the given branch.
          if ! git merge-base --is-ancestor "${COMMIT}" "origin/${BRANCH}"; then
            echo "::error::Commit '${COMMIT}' does not belong to branch '${BRANCH}'."
            exit 1
          fi

          echo "Verified: commit ${COMMIT} exists and belongs to branch ${BRANCH}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prevent rebuilding a released commit
        env:
          TARGET_COMMIT: ${{ github.event.inputs.commit || github.sha }}
        run: |
          set -euo pipefail

          # Ensure release tags are available locally.
          git fetch --quiet --tags origin

          # A commit is considered "released" only if a semver tag (optionally
          # prefixed with 'v') points directly at it.
          RELEASE_TAG="$(
            git tag --points-at "$TARGET_COMMIT" |
              awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }'
          )"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "::error::Commit ${TARGET_COMMIT} was already released as ${RELEASE_TAG}. Reuse the existing artifact instead of rebuilding it."
            exit 1
          fi

          echo "Commit ${TARGET_COMMIT} has not been released; proceeding."

      - name: Summary
        env:
          ARTIFACT_TYPE: ${{ github.event.inputs.artifactType || 'SNAPSHOT' }}
          COMMIT: ${{ github.event.inputs.commit || github.sha }}
          BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          {
            echo "### Build and Deploy summary"
            echo ""
            echo "- **Trigger:** ${{ github.event_name }}"
            echo "- **Artifact type:** ${ARTIFACT_TYPE}"
            echo "- **Commit:** ${COMMIT}"
            echo "- **Branch:** ${BRANCH}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
